*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--cream);color:var(--ink);font:400 17px/1.65 var(--sans);display:flex;flex-direction:column;min-height:100vh}
header{background:var(--navy);color:var(--cream);padding:12px 24px}

header img{width:48px;height:48px;border-radius:50%;background:var(--cream);padding:4px}
main{flex:1;display:grid;place-items:center;padding:48px 24px}
.card{max-width:560px;width:100%;background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--rose);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:32px 24px;text-align:center}
.card img{width:180px;max-width:60%;height:auto;margin:0 auto 16px;display:block}
.eyebrow{font:600 11px/1.6 var(--serif);letter-spacing:.12em;text-transform:uppercase;color:var(--olive);margin:0}
h1{font:700 clamp(28px,6vw,40px)/1.15 var(--display);color:var(--navy);margin:8px 0 12px;letter-spacing:-.02em}
p{margin:0 0 20px;color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.links a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 20px;border-radius:var(--radius-control);font:600 13px/1.4 var(--serif);letter-spacing:.06em;text-decoration:none}
.home{background:var(--navy);color:var(--cream)}
.book{background:var(--rose);color:var(--navy)}
.guide{background:var(--olive);color:var(--paper)}
.links a:hover{filter:brightness(1.1)}
.links a:focus-visible{outline:3px solid var(--terra);outline-offset:3px}
footer{background:var(--navy-deep);color:var(--cream);text-align:center;padding:24px;font:600 12px/1.6 var(--serif);letter-spacing:.12em;text-transform:uppercase}
footer span{color:var(--rose)}
